<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projetos · Organizador</title>
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <header class="topbar">
          <div>
            <h1>Projetos</h1>
            <p class="sub">Projetos científicos, side hustles e iniciativas paralelas.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="btn-oportunidade">+ Oportunidade</button>
            <button class="btn primary" id="btn-projeto">+ Projeto</button>
          </div>
        </header>

        <div class="grid g3" style="margin-bottom:14px;">
          <div class="card">
            <div class="stat-label">Projetos ativos</div>
            <div class="stat-value num" id="s-ativos">—</div>
            <div class="stat-sub" id="s-ativos-d"></div>
          </div>
          <div class="card">
            <div class="stat-label">Etapas concluídas</div>
            <div class="stat-value num" id="s-etapas">—</div>
            <div class="stat-sub" id="s-etapas-d"></div>
          </div>
          <div class="card">
            <div class="stat-label">Deadline mais próximo</div>
            <div class="stat-value" id="s-deadline" style="font-size:19px;">—</div>
            <div class="stat-sub" id="s-deadline-d"></div>
          </div>
        </div>

        <div id="projetos"></div>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Oportunidades de renda</h2>
            <span class="card-note">ideias compatíveis com a carga da faculdade</span>
          </div>
          <div class="card"><div id="oportunidades"></div></div>
        </section>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="ui.js"></script>
  <script src="projetos.js"></script>
</body>
</html>
